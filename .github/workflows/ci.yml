name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked major-version ranges
        run: python -m pip install -r requirements.txt
      - name: Validate distribution files and private-data exclusions
        run: python scripts/validate_repository.py
      - name: Compile Python modules
        run: python -m compileall -q studio.py engine.py creative.py photo_researcher.py tests
      - name: Run unit and PDF integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
