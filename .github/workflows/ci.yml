name: CI
on:
  push:
    branches: [main, develop, production-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install hash-locked runtime
        run: python -m pip install -r requirements.txt
      - name: Validate distribution files and private-data exclusions
        run: python scripts/validate_repository.py
      - name: Compile Python modules
        run: python -m compileall -q studio.py engine.py creative.py photo_researcher.py image_transport.py finalized_edition.py local_files.py tests
      - name: Run unit and PDF integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Check locked runtime advisories
        run: python -m pip_audit --disable-pip --no-deps -r requirements.txt
